[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  directory = "netlify/functions"
  included_files = []

[[redirects]]
  from = "/feed.xml"
  to = "/.netlify/functions/rss"
  status = 200

[[redirects]]
  from = "/:section/feed.xml"
  to = "/.netlify/functions/rss"
  status = 200

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200

[[redirects]]
  from = "/og/*"
  to = "/.netlify/functions/og-image"
  status = 200

[[redirects]]
  from = "/api/publish"
  to = "/.netlify/functions/api-publish"
  status = 200

[[redirects]]
  from = "/api/pipeline"
  to = "/.netlify/functions/api-pipeline"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
